<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life sim charts</title>
<style>
  /* Same colours as the main page (templates/index.html). */
  :root {
    --bg: #faf9f5; --surface: #f0eee6; --panel: #f5f3ec; --text: #1f1e1d;
    --text-secondary: #5f5e5a; --text-muted: #888780; --border: #d3d1c7; --accent: #6a61d1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918; --surface: #2c2c2a; --panel: #222120; --text: #f1efe8;
      --text-secondary: #b4b2a9; --text-muted: #888780; --border: #444441; --accent: #9d96ea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 20px 28px; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif;
  }
  header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 6px; }
  h1 { font-size: 18px; font-weight: 500; margin: 0; }
  #clock { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  #status { color: var(--text-secondary); margin: 18px 0; }
  a { color: var(--accent); }
  #status[hidden], main[hidden] { display: none; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--text-secondary); margin: 0 0 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 14px; }
  .chart { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 10px; min-width: 0; }
  .chart.wide { grid-column: 1 / -1; }
  h2 { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0 0 8px; }
  .plot { position: relative; cursor: crosshair; }
  .plot canvas { display: block; width: 100%; height: 250px; }
  .chart.wide .plot canvas { height: 330px; }
  .cross { position: absolute; top: 0; bottom: 18px; width: 1px; background: var(--text); opacity: 0.45; pointer-events: none; }
  .cross[hidden] { display: none; }
  #tree { display: block; width: 100%; height: 30px; }
  .hint { color: var(--text-secondary); font-size: 13px; margin: 0 0 8px; }
  #tip {
    position: fixed; z-index: 5; pointer-events: none; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18); max-width: 300px;
  }
  #tip[hidden] { display: none; }
  #tip .when { color: var(--text-secondary); margin-bottom: 4px; }
  #tip .row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  #tip .row span:last-child { margin-left: auto; padding-left: 14px; }
  @media (max-width: 520px) { .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>Life sim charts</h1>
  <span id="clock"></span>
</header>
<p id="status">Connecting to the life sim…</p>
<main hidden>
  <div class="key" id="key"></div>
  <div class="grid" id="grid"></div>
  <section class="chart wide" style="margin-top:14px">
    <h2>Family tree</h2>
    <p class="hint">From the start of this world to now. Each species branches from the one it split from.</p>
    <canvas id="tree"></canvas>
  </section>
</main>
<div id="tip" hidden></div>
<script type="module" src="{{ url_for('static', filename='ui/popout.js') }}"></script>
</body>
</html>
